targets:
  $default:
    builders:
      json_serializable:
        options:
          # Firestore returns nested maps that are not always typed as
          # Map<String, dynamic>; any_map makes generated parsers tolerant.
          any_map: true
          explicit_to_json: true
          include_if_null: true
          checked: false
      freezed:
        options:
          # Dart 3.13 rejects the `final` modifier freezed adds to collection
          # parameters when it wraps them in unmodifiable views. Entities are
          # only ever copied (copyWith), never mutated, so plain lists are safe.
          make_collections_unmodifiable: false
